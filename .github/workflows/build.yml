name: Build Tzz SMP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct Tzz SMP source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/src-*.b64 | tr -d '\n\r ' | base64 -d > TzzSMP-source.tar.xz
          echo "e7f61112273973b5b65528c3ce7bd95386851ecc35bcf546a168895d57607619  TzzSMP-source.tar.xz" | sha256sum -c -
          mkdir source
          tar -xJf TzzSMP-source.tar.xz -C source
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: source/pom.xml
      - name: Make scripts executable
        run: chmod +x source/mvnw source/scripts/verify-source.sh
      - name: Static source checks
        working-directory: source
        run: ./scripts/verify-source.sh
      - name: Compile and test
        working-directory: source
        run: ./mvnw -B -ntp clean verify
      - name: Upload Tzz SMP JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TzzSMP-1.0.0
          path: source/target/TzzSMP-1.0.0.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TzzSMP-test-reports
          path: source/target/surefire-reports/**
          if-no-files-found: ignore
